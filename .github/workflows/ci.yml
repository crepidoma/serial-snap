name: CI

on:
  pull_request:
  # mainへのpushでは、配布の前にDeployのワークフローから呼ぶ。
  workflow_call:
  # Actionsの画面から手で動かせるようにする。
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    # 実行環境が固まって止まらないことがあるため、ふだんの数倍の上限を付ける。
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
